# 压测专用配置：3 个 benchmock 假上游（compose bench profile 内）
# 目标：剥离真实推理，测网关自身开销与并发上限。缓存默认关闭以便测“转发”路径。
server:
  addr: ":8080"
  read_timeout: 30s
  usage_file: "/app/data/usage.jsonl"
  # 压测防膨胀：usage.jsonl 按大小自动轮转并压缩，最多留 5 份 × 50MB
  usage_max_size: 50      # 单文件 MB，超过则切割
  usage_max_backups: 5    # 最多保留旧文件数
  usage_max_age: 1        # 旧文件保留天数
  usage_compress: true    # 压缩旧文件
  # usage_enable: false   # 只看 QPS/延迟、不需要用量账本时，关闭落库彻底消除写入与磁盘开销

transport:
  max_idle_conns: 2000
  max_idle_conns_per_host: 500
  idle_conn_timeout: 90s
  dial_context_timeout: 3s
  tls_handshake_timeout: 5s
  response_header_timeout: 30s

upstreams:
  - name: mock-a
    type: openai
    base_url: http://benchmock-a:11499/v1
    models: ["bench-gpt"]
    per_response_timeout: 60s
    stream_chunk_timeout: 10s
    weight: 1
    key_pool: ["sk-mock"]
    health:
      { path: /models, interval: 3s, timeout: 2s, fail_threshold: 2, ok_threshold: 1 }

  - name: mock-b
    type: openai
    base_url: http://benchmock-b:11499/v1
    models: ["bench-gpt"]
    per_response_timeout: 60s
    stream_chunk_timeout: 10s
    weight: 1
    key_pool: ["sk-mock"]
    health:
      { path: /models, interval: 3s, timeout: 2s, fail_threshold: 2, ok_threshold: 1 }

  # mock-c 在 compose 里配了 -error-rate 0.5，用来演示故障转移 / 熔断 / 健康剔除
  - name: mock-c
    type: openai
    base_url: http://benchmock-c:11499/v1
    models: ["bench-gpt"]
    per_response_timeout: 60s
    stream_chunk_timeout: 10s
    weight: 1
    key_pool: ["sk-mock"]
    health:
      { path: /models, interval: 3s, timeout: 2s, fail_threshold: 2, ok_threshold: 1 }

tenants:
  - id: bench-01
    name: bench-load-tester
    api_key: sk-llmgate-bench
    allowed_models: [bench-gpt]
    # 压测时把限流放到极高，避免限流器成为瓶颈；单独测限流时再调低
    rate_limit_rpm: 1000000
    rate_limit_tpm: 100000000
    balance: 100000000000

logger:
  level: "info"          # 高并发下 trace 会刷屏，压测用 info
  file_enable: false
  console_enable: true
  filename: "/app/log/llmgate.log"
  max_size: 100
  max_backups: 10
  max_age: 7
  compress: true

redis:
  addr: "redis:6379"
  password: ""
  db: 0

cache:
  enable: false          # 测“网关转发”开销时关闭；测缓存命中率时改 true
