server:
  addr: ":8080"
  read_timeout: 30s
#  write_timeout: 120s

transport:
  max_idle_conns: 200
  max_idle_conns_per_host: 100
  idle_conn_timeout: 90s
  dial_context_timeout: 5s
  tls_handshake_timeout: 5s
  response_header_timeout: 60s

upstreams:
#  - name: ollama-native-a
#    type: ollama
#    base_url: http://localhost:11434
#    models: ["qwen2.5:0.5b", "qwen2.5:1.5b", "deepseek-coder:1.3b"]
#    per_response_timeout: 5m
#    stream_chunk_timeout: 10s
#    weight: 3
#    health:
#      {
#        path: /api/tags,
#        interval: 5s,
#        timeout: 2s,
#        fail_threshold: 3,
#        ok_threshold: 2
#      }

  - name: ollama-native-b
    type: openai
    base_url: http://localhost:11435/v1
    models: ["qwen2.5:0.5b", "qwen2.5:1.5b", "deepseek-coder:1.3b"]
    per_response_timeout: 5m
    stream_chunk_timeout: 10s
    weight: 1
    health:
      {
        path: /models,
        interval: 5m,
        timeout: 2s,
        fail_threshold: 3,
        ok_threshold: 2
      }
    key_pool:
      - "sk-upstream-b-key-01"
      - "sk-upstream-b-key-02"
      - "sk-upstream-b-key-03"
      - "sk-upstream-b-key-04"
      - "sk-upstream-b-key-05"

#  - name: deepseek-remote
