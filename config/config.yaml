tenants:
  - id: t1
    name: zhang-san
    api_key: sk-llmgate-zhangsan-key
    allowed_models: [qwen2.5:1.5b, deepseek-coder:1.3b]
    rate_limit_rpm: 20
    balance: 10000
  - id: t2
    name: li-si
    api_key: sk-llmgate-lisi-key
    allowed_models: [deepseek-coder:1.3b]
    rate_limit_rpm: 20
    balance: 1000

logger:
  level: "trace"
  file_enable: false
  console_enable: true
  filename: "./log/llmgate.log"
  max_size: 100
  max_backups: 10
  max_age: 7
  compress: true