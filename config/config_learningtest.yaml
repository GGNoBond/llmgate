#server
backend:
  port: 8888
  name: "demo-httpserver"

proxy:
  port: 8080
  name: "proxy-server"
  forward_peers: [
    {
      name: "demo-http",
      protocol: "http",
      host: "localhost",
      port: 8888,
      path: "/",
      prefix: "/demo-http"
    },
    {
      name: "ollama-http",
      protocol: "http",
      host: "localhost",
      port: 11434,
      path: "/api/chat",
      prefix: "/ollama"
    }
  ]

logger:
  # debug:0 info:1 warn:2 error:3 fatal:4
  level: 0
  # stdout: file: both
  output: ["stdout"]
  dir: "./log"
