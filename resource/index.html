<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>读取JSON示例</title>
    <style>
        pre {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
<h2>JSON数据展示</h2>
<div id="result"></div>

<script>
    // 读取 testjson.json
    fetch('/static/testjson.json')
        .then(res => res.json())
        .then(data => {
            document.getElementById('result').innerText = JSON.stringify(data, null, 2);
        })
        .catch(err => {
            document.getElementById('result').innerText = "加载失败：" + err;
        })
</script>
</body>
</html>
